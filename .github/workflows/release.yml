name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  native:
    name: Native ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} -p pysonar-cli -p pysonar-lsp
      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist/pysonar2-${{ github.ref_name }}-${{ matrix.target }}/bin
          cp target/${{ matrix.target }}/release/pysonar target/${{ matrix.target }}/release/pysonar-lsp dist/pysonar2-${{ github.ref_name }}-${{ matrix.target }}/bin/
          cp LICENSE README.md dist/pysonar2-${{ github.ref_name }}-${{ matrix.target }}/
          tar -C dist -czf dist/pysonar2-${{ github.ref_name }}-${{ matrix.target }}.tar.gz pysonar2-${{ github.ref_name }}-${{ matrix.target }}
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/pysonar2-${{ github.ref_name }}-${{ matrix.target }}/bin
          Copy-Item target/${{ matrix.target }}/release/pysonar.exe,target/${{ matrix.target }}/release/pysonar-lsp.exe dist/pysonar2-${{ github.ref_name }}-${{ matrix.target }}/bin/
          Copy-Item LICENSE,README.md dist/pysonar2-${{ github.ref_name }}-${{ matrix.target }}/
          Compress-Archive dist/pysonar2-${{ github.ref_name }}-${{ matrix.target }} dist/pysonar2-${{ github.ref_name }}-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v6
        with:
          name: pysonar2-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v6
        with:
          name: pysonar2-${{ matrix.target }}-zip
          path: dist/*.zip
          if-no-files-found: ignore

  integrations:
    name: Integration packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - run: npm ci
        working-directory: editors/vscode
      - run: npm run package
        working-directory: editors/vscode
      - run: npm run build
        working-directory: extensions/browser
      - run: npm run check
        working-directory: extensions/browser
      - run: npm run package
        working-directory: extensions/browser
      - name: Collect packages
        run: |
          mkdir -p dist
          cp editors/vscode/*.vsix dist/
          cp extensions/browser/dist/*.zip dist/
      - uses: actions/upload-artifact@v6
        with:
          name: pysonar2-integrations
          path: dist/*

  publish:
    needs: [native, integrations]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
