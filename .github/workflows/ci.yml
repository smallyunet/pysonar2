name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Java ${{ matrix.java }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: "11"
            python: "3.10"
          - java: "17"
            python: "3.11"
          - java: "21"
            python: "3.12"
          - java: "21"
            python: "3.13"
          - java: "21"
            python: "3.14"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: mvn --batch-mode verify

  vscode-extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
        working-directory: editors/vscode
      - run: npm run check
        working-directory: editors/vscode
      - run: npm run build
        working-directory: editors/vscode
      - run: npm run smoke
        working-directory: editors/vscode
      - run: npm run package
        working-directory: editors/vscode
