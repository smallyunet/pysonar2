[workspace]
members = [
  "crates/pysonar-core",
  "crates/pysonar-protocol",
  "crates/pysonar-cli",
  "crates/pysonar-lsp",
  "crates/pysonar-wasm",
]
resolver = "2"

[workspace.package]
version = "4.0.0"
edition = "2024"
rust-version = "1.88"
authors = ["smallyu"]
license = "Apache-2.0"
repository = "https://github.com/smallyunet/pysonar2"

[workspace.dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.40", features = ["derive"] }
console_error_panic_hook = "0.1.7"
encoding_rs = "0.8.35"
ignore = "0.4.23"
indexmap = { version = "2.9.0", features = ["serde"] }
lsp-types = "0.97.0"
ruff_python_ast = { git = "https://github.com/astral-sh/ruff.git", tag = "0.11.13" }
ruff_python_parser = { git = "https://github.com/astral-sh/ruff.git", tag = "0.11.13" }
ruff_text_size = { git = "https://github.com/astral-sh/ruff.git", tag = "0.11.13" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
tempfile = "3.20.0"
thiserror = "2.0.12"
tokio = { version = "1.45.1", features = ["io-std", "macros", "rt-multi-thread", "sync"] }
tower-lsp = "0.20.0"
url = "2.5.4"
walkdir = "2.5.0"
wasm-bindgen = "0.2.100"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "fat"
